<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Mangathèque</title>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              clifford: "#102661",
              start: "#391d9d",
              middle: "#741cb6",
              end: "#391888",
              bodyStart: "#0d0b35",
              bodyEnd: "#102661",
            },
          },
        },
      };
    </script>
  </head>
  <body class="bg-gray-900 text-white">
    <!-- Header -->
    <header class="px-8 py-4 bg-gray-900 text-white">
      <div class="flex justify-between items-center pb-2 border-b-2">
        <div class="flex items-center gap-4">
          <!-- Menu mobile button -->
          <button
            id="menu-btn"
            aria-label="Open mobile menu"
            class="focus:outline-none hover:text-pink-500"
          >
            <svg
              class="w-8 h-8"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 6h16M4 12h16m-7 6h7"
              />
            </svg>
          </button>

          <!-- Logo and title -->
          <div class="flex items-center gap-4">
            <img
              class="h-16 w-16 rounded-full"
              src="../public/img/logo.png"
              alt="Logo JustToShowOf"
            />
            <h1 class="text-lg font-semibold">JustToShowOf</h1>
          </div>
        </div>

        <!-- Search and User Icon -->
        <div class="flex items-center gap-4">
          <input
            class="h-8 w-64 rounded-lg px-3 text-white bg-gray-500 focus:bg-white"
            type="search"
            name="search"
            placeholder="Rechercher"
            id="search"
          />

          <div>
            <i class="text-2xl fas fa-user" aria-label="User icon"></i>
          </div>
        </div>
      </div>

      <!-- Mobile Menu -->
      <div
        id="mobile-menu"
        class="hidden bg-gray-800 text-white p-4 mt-2 rounded-lg"
      >
        <nav>
          <ul class="flex flex-col gap-4">
            <li>
              <a class="cursor-pointer hover:text-pink-500" href="index.html"
                >Accueil</a
              >
            </li>
            <li>
              <a
                class="cursor-pointer hover:text-pink-500"
                href="mangatheque.html"
                >Mangathèque</a
              >
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <!-- Main content section -->
    <section class="px-8 py-4">
      <h1 class="text-3xl font-bold pb-4">Tous les Mangas</h1>
      <div class="flex">
        <!-- Sidebar for Filters -->
        <aside class="bg-gray-800 text-white p-4 rounded-lg w-1/4 mr-8">
          <h2 class="text-xl font-semibold mb-2">Filtres</h2>
          <ul class="space-y-2">
            <li><a href="#" class="hover:text-pink-500">Tous</a></li>
            <li><a href="#" class="hover:text-pink-500">Shonen</a></li>
            <li><a href="#" class="hover:text-pink-500">Seinen</a></li>
            <li><a href="#" class="hover:text-pink-500">Shojo</a></li>
            <li><a href="#" class="hover:text-pink-500">Isekai</a></li>
            <li><a href="#" class="hover:text-pink-500">Fantasy</a></li>
          </ul>
        </aside>

        <!-- Manga Grid Display -->
        <div
          id="manga-grid"
          class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 w-3/4"
        >
          <!-- Manga items will be dynamically added here -->
          <!-- Example Manga Card -->
          <div class="bg-gray-700 rounded-lg p-4">
            <img
              class="h-60 w-full object-cover rounded-lg mb-4"
              src="https://via.placeholder.com/150"
              alt="Manga Title"
            />
            <h3 class="text-xl font-semibold mb-2">Titre Manga</h3>
            <p class="text-gray-300 mb-2">Auteur : Nom Auteur</p>
            <span class="text-sm text-gray-400 bg-gray-800 p-1 rounded-lg"
              >Genre</span
            >
          </div>
        </div>
      </div>
    </section>

    <script>
      // Toggle mobile menu
      const menuBtn = document.getElementById("menu-btn");
      const mobileMenu = document.getElementById("mobile-menu");

      menuBtn.addEventListener("click", () => {
        mobileMenu.classList.toggle("hidden");
      });
    </script>
    <script src="../public/js/mangatheque.js"></script>
  </body>
</html>
